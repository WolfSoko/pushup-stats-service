name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Für PRs nur Read-Token, für main Pushes Write-Token.
      # Bei Fork-PRs sind Secrets automatisch nicht verfügbar.
      NX_CLOUD_ACCESS_TOKEN: >-
        ${{
          github.event_name != 'pull_request'
            && secrets.NX_CLOUD_ACCESS_TOKEN_WRITE
          || github.event.pull_request.head.repo.full_name == github.repository
            && secrets.NX_CLOUD_ACCESS_TOKEN_WRITE
          || secrets.NX_CLOUD_ACCESS_TOKEN_READ
        }}
      # 4 GB Node heap for the orchestrator job. High enough for the Angular
      # SSR build in CI, and matches the per-agent heap configured in
      # `.nx/workflows/distribution-config.yaml` so a task can run on either
      # side without a different OOM threshold. Bump in lockstep with the
      # agent setting if the heavy targets ever need more.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Use corepack to install the exact pnpm version pinned in package.json's
      # `packageManager` field, instead of letting pnpm/action-setup@v6 pick
      # its own version (see pnpm/action-setup#228).
      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `nx-set-shas` setzt NX_BASE/NX_HEAD normalerweise selbst. Liefert es
      # nichts (beobachtet in Lauf 2710), fällt Nx auf sein Default
      # `--base=main` zurück — und `main` existiert im PR-Checkout nicht als
      # lokale Ref: `actions/checkout` holt nur die PR-Ref, `fetch-depth: 0`
      # vertieft die Historie, legt aber keine zusätzliche Branch-Ref an.
      # `git diff … main HEAD` bricht dann mit "unknown revision" ab, bevor
      # ein einziges Target läuft. Dieser Fetch macht den Fallback benutzbar,
      # statt sich darauf zu verlassen, dass die Action immer liefert.
      - name: Base-Ref für den Nx-Fallback bereitstellen
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin '+refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}'

      - uses: nrwl/nx-set-shas@v5
      - name: Nx Cloud distributed run starten
        # Dynamic agent allocation: small PRs use 4 agents, large changesets
        # scale up. Config: .nx/workflows/distribution-config.yaml
        #
        # `--with-env-vars="NODE_OPTIONS"` forwards the orchestrator's
        # `NODE_OPTIONS=--max-old-space-size=4096` env to every agent's task
        # process. Without this flag, agents would run with V8's default
        # ~2 GB old-space heap regardless of what we set on the GH job, and
        # heavy targets (Angular SSR build, Vitest with Firebase/Material)
        # would GC-thrash or OOM only on the agent side.
        # Docs: https://nx.dev/docs/reference/nx-cloud/launch-templates
        run: pnpm exec nx-cloud start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="lint,test,build" --with-env-vars="NODE_OPTIONS"

      # `--outputStyle=stream` so the agents' task output lands in this log.
      # Nx defaults to `static-failures-only` in CI, which prints a failing
      # task's output — but with Nx Agents the task ran elsewhere and its
      # output stays in Nx Cloud, leaving only a summary table and a link
      # behind. Costs a noisier log; buys being able to read a failure here.
      - name: Nx affected (lint + test + build)
        run: pnpm exec nx affected -t=lint,test,build -c=production --outputStyle=stream

      # `--outputStyle=stream` brings back the output of tasks that finish,
      # but a *failing* distributed task keeps its log in Nx Cloud — which a
      # CI access token cannot read. Re-run the tests here, undistributed, so
      # the assertion that failed is readable in this log. Only on the
      # failure path, so a green run pays nothing.
      - name: Fehlgeschlagene Tests unverteilt wiederholen (lesbarer Log)
        if: failure()
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
        run: pnpm exec nx affected -t=test -c=production --outputStyle=stream --skip-nx-cache

      - name: Nx fix-ci (always)
        if: always()
        run: pnpm exec nx fix-ci

  # Runs in parallel to lint-test-build. Every atomized `e2e-ci--<spec>`
  # task depends on the continuous `web:serve-e2e` target (wired up by
  # @nx/playwright/plugin from the `webServer` block in
  # web/playwright.config.ts), so Nx boots one server per agent and all
  # specs on that agent attach to it instead of spawning their own.
  #
  # `serve-e2e` runs the same `node dist/web/server/server.mjs` that App
  # Hosting runs in production, so it depends on `web:build:production` —
  # shared with the sibling job through Nx Cloud's remote cache when that
  # job pushed the artifact first, rebuilt here otherwise.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: >-
        ${{
          github.event_name != 'pull_request'
            && secrets.NX_CLOUD_ACCESS_TOKEN_WRITE
          || github.event.pull_request.head.repo.full_name == github.repository
            && secrets.NX_CLOUD_ACCESS_TOKEN_WRITE
          || secrets.NX_CLOUD_ACCESS_TOKEN_READ
        }}
      # Same 4 GB heap rationale as the lint-test-build job — the Playwright
      # webServer boots the Angular SSR build, which is the heaviest task
      # the orchestrator runs locally before handing off to agents.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `nx-set-shas` setzt NX_BASE/NX_HEAD normalerweise selbst. Liefert es
      # nichts (beobachtet in Lauf 2710), fällt Nx auf sein Default
      # `--base=main` zurück — und `main` existiert im PR-Checkout nicht als
      # lokale Ref: `actions/checkout` holt nur die PR-Ref, `fetch-depth: 0`
      # vertieft die Historie, legt aber keine zusätzliche Branch-Ref an.
      # `git diff … main HEAD` bricht dann mit "unknown revision" ab, bevor
      # ein einziges Target läuft. Dieser Fetch macht den Fallback benutzbar,
      # statt sich darauf zu verlassen, dass die Action immer liefert.
      - name: Base-Ref für den Nx-Fallback bereitstellen
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin '+refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}'

      - uses: nrwl/nx-set-shas@v5
      - name: Nx Cloud distributed run starten
        run: pnpm exec nx-cloud start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="e2e-ci" --with-env-vars="NODE_OPTIONS"

      # `web-e2e-emulator` is excluded here and runs in its own job: it
      # needs Java and the Firebase emulator JARs, which the Nx Cloud
      # agent image is not guaranteed to carry, and atomizing it would
      # boot one emulator per shard for a suite that takes a minute.
      - name: Nx affected (e2e)
        run: pnpm exec nx affected -t=e2e-ci -c=production --outputStyle=stream --exclude=web-e2e-emulator

      - name: Nx fix-ci (always)
        if: always()
        run: pnpm exec nx fix-ci

  # The critical-path suite: registering, signing in, adding a friend and
  # answering the request, and working through a training session. It
  # runs against the Firebase emulators rather than the live project, so
  # unlike the `e2e` job above it needs Java (the Firestore emulator is a
  # JAR) and a browser download. Undistributed on purpose — see
  # web/web-e2e-emulator/README.md.
  e2e-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Java (Firestore-Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The emulator JARs are a ~100 MB download that firebase-tools
      # otherwise fetches on every run before anything can start.
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Playwright-Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E gegen die Emulatoren
        run: pnpm exec nx run web-e2e-emulator:e2e --outputStyle=stream

      - name: Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-emulator-report
          path: dist/.playwright/web/web-e2e-emulator
          retention-days: 7

  # Builds web:build:production once (on a plain GitHub Actions runner —
  # the same environment family that seeded the Nx Cloud remote cache in
  # lint-test-build, so this reliably restores from cache instead of
  # rebuilding) and publishes it as a GitHub Release asset. App Hosting's
  # buildCommand (scripts/fetch-release-artifact.sh) downloads this instead
  # of ever running the Angular build itself — see docs/ci-cd.md.
  #
  # The release tag is deterministic from the commit SHA
  # (deploy-0.0.0-g<short-sha>) so the App Hosting build can construct the
  # download URL directly, with no git-tag lookup or API call needed.
  publish-release:
    needs: [lint-test-build, e2e, e2e-emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_READ }}
      NODE_OPTIONS: --max-old-space-size=4096
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `fetch-depth: 0` alone does not fetch tags. Without this, `git
          # tag` sees nothing locally and `nx release changelog` fails with
          # "Unable to determine the previous git tag" even though the
          # previous `deploy-*` tag exists on the remote.
          fetch-tags: true

      # nx release changelog creates an annotated git tag, which needs a
      # tagger identity — a fresh runner has none configured by default.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One release name for the whole job: the Sentry release, the
      # build-info.json the admin area reads and the deploy tag must all
      # name the same commit, abbreviated the same way.
      - name: Resolve release name
        id: release
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build web:build:production
        run: pnpm exec nx run web:build:production

      - name: Upload Sentry source maps
        run: pnpm sentry:sourcemaps
        env:
          SENTRY_RELEASE: ${{ steps.release.outputs.sha }}

      # After the build, never inside it: a per-commit build input would give
      # every commit its own Nx hash and defeat the cache restore this job
      # relies on. See web/src/build-info.ts.
      - name: Write build info into the artifact
        run: node tools/src/write-build-info.mjs
        env:
          SENTRY_RELEASE: ${{ steps.release.outputs.sha }}

      - name: Package build output
        run: tar -C dist/web -czf dist-web.tar.gz .

      - name: Version + publish GitHub Release
        run: |
          SHA="${{ steps.release.outputs.sha }}"
          # `g` prefix (git-describe convention) keeps the prerelease
          # identifier alphanumeric. A bare short SHA that happens to be all
          # digits with a leading zero — roughly 1 commit in 268 — is invalid
          # semver, and `nx release version` rejects it outright.
          SPECIFIER="0.0.0-g${SHA}"
          TAG="deploy-${SPECIFIER}"

          # Resumable on purpose. The tag is pushed before the artifact is
          # uploaded, so a run that dies in between — cancelled, runner
          # reclaimed, network blip — used to leave the commit permanently
          # unreleasable: every retry died on "tag already exists", and with
          # `promote-to-deploy` gated on this job, production stayed behind
          # main until someone deleted the tag by hand. An existing tag now
          # means "an earlier attempt got this far", so the job finishes the
          # release instead of starting it over.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists — resuming the release for this commit."
          else
            FIRST_RELEASE_FLAG=""
            if ! git ls-remote --tags origin "refs/tags/deploy-*" | grep -q .; then
              FIRST_RELEASE_FLAG="--first-release"
            fi
            pnpm exec nx release version "$SPECIFIER" $FIRST_RELEASE_FLAG --git-commit=false --stage-changes=false
            pnpm exec nx release changelog "$SPECIFIER" $FIRST_RELEASE_FLAG --git-commit=false --git-tag=true --git-push=true
          fi

          # The release can be missing while the tag is not: the interrupted
          # run may have died between pushing the tag and creating it.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --title "$TAG" --notes "Deploy build for ${SHA}."

          # --clobber: a resumed run re-uploads the artifact it just rebuilt,
          # replacing whatever a partial attempt left behind.
          gh release upload "$TAG" dist-web.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After successful CI + release publishing on main, fast-forward the
  # deploy branch. Firebase App Hosting watches this branch instead of
  # main, so it only deploys code that passed lint + test + build + e2e
  # AND already has a matching release artifact published.
  promote-to-deploy:
    needs: [lint-test-build, e2e, e2e-emulator, publish-release]
    if: github.ref == 'refs/heads/main'
    # A push failure here must not block the Firebase Hosting deploy
    # (which gates on the overall CI workflow conclusion).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a PAT so the push triggers downstream workflows
          # (pushes with GITHUB_TOKEN don't trigger further workflows).
          token: ${{ secrets.DEPLOY_PUSH_TOKEN }}
      - name: Fast-forward deploy branch
        run: |
          git fetch origin deploy || true
          git push origin HEAD:refs/heads/deploy
