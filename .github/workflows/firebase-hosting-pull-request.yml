# Staging preview on request: the handshake half.
#
# When a PR opens, `request_preview` posts one comment carrying a checkbox.
# Ticking the box edits that comment, which fires `issue_comment` and runs
# `trigger_preview`: it unticks the box (so it can be ticked again for a
# fresh deploy), checks that the PR head is same-repo and the requester has
# write access, and dispatches firebase-hosting-staging-preview.yml on the
# PR branch. That workflow does the build, the deploy and the staging E2E
# and writes the result back into the same comment.
#
# The job here never checks out code: `issue_comment` workflows run with
# secrets, and checking out a PR head in that context is what CodeQL's
# untrusted-checkout rule flags. The dispatched workflow runs on the PR
# branch like any push-triggered workflow would, so it also picks up
# changes to the deploy steps from the PR itself.
name: Deploy to Firebase Staging on PR
on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [edited]
permissions:
  contents: read
  pull-requests: write
env:
  PREVIEW_MARKER: '<!-- staging-preview-request -->'
  PREVIEW_CHECKBOX: 'Preview auf Staging deployen'
  PREVIEW_WORKFLOW: firebase-hosting-staging-preview.yml
jobs:
  # Skipped for fork PRs (no WIF access, and GITHUB_TOKEN is read-only
  # there) and for Dependabot PRs (read-only token as well, and a
  # dependency bump does not need a staging cycle).
  request_preview:
    if: >-
      ${{
        github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post preview request comment (once per PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$PREVIEW_MARKER\")))] | length")
          if [ "$existing" != "0" ]; then
            echo "Request comment already present, nothing to do."
            exit 0
          fi
          body=$(cat <<BODY
          $PREVIEW_MARKER
          ### 🚀 Staging-Preview

          Das Preview-Deployment (Hosting-Channel, Cloud Functions, Firestore-Regeln & -Indizes im Staging-Projekt, danach Critical-Path-E2E) läuft nicht automatisch. Zum Auslösen die Checkbox anhaken – sie wird nach dem Start wieder geleert und kann für ein weiteres Deployment erneut angehakt werden.

          - [ ] $PREVIEW_CHECKBOX

          _Status: noch kein Deployment angefordert._
          BODY
          )
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --silent

  trigger_preview:
    if: >-
      ${{
        github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.login == 'github-actions[bot]'
          && contains(github.event.comment.body, '<!-- staging-preview-request -->')
          && contains(github.event.comment.body, '- [x] Preview auf Staging deployen')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # gh api …/dispatches
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      SENDER: ${{ github.event.sender.login }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Untick first: our own edits never re-trigger the workflow (GITHUB_TOKEN
      # events don't), and a still-ticked box could not be ticked again.
      - name: Untick checkbox and mark request as accepted
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
          body=$(printf '%s' "$body" | sed -e "s/- \[[xX]\] $PREVIEW_CHECKBOX/- [ ] $PREVIEW_CHECKBOX/" -e '/^_Status: /d')
          printf '%s\n\n_Status: ⏳ Deployment wird gestartet (angefordert von @%s)._\n' "$body" "$SENDER" > /tmp/comment-body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@/tmp/comment-body.md --silent

      # Fork heads never get deployed (the dispatched workflow would run
      # foreign code with the WIF credential), and the person ticking the
      # box has to have write access — GitHub already restricts checkbox
      # toggles that way, this keeps it explicit.
      - name: Resolve PR head and dispatch the preview workflow
        run: |
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,isCrossRepository,state)
          if [ "$(printf '%s' "$pr" | jq -r .isCrossRepository)" != "false" ]; then
            echo "::error::Preview deployments are limited to same-repo PRs"; exit 1
          fi
          if [ "$(printf '%s' "$pr" | jq -r .state)" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is not open"; exit 1
          fi
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          case "$perm" in
            admin|write) ;;
            *) echo "::error::@$SENDER has no write access ($perm)"; exit 1 ;;
          esac
          head_ref=$(printf '%s' "$pr" | jq -r .headRefName)
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$PREVIEW_WORKFLOW/dispatches" \
            -f ref="$head_ref" \
            -f "inputs[pr_number]=$PR_NUMBER" \
            -f "inputs[comment_id]=$COMMENT_ID" \
            -f "inputs[requested_by]=$SENDER"

      - name: Report a failed start in the request comment
        if: failure()
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body | sed '/^_Status: /d')
          printf '%s\n\n_Status: ❌ Deployment konnte nicht gestartet werden ([Run](%s)) – der PR-Branch braucht `.github/workflows/%s` (main mergen?)._\n' "$body" "$RUN_URL" "$PREVIEW_WORKFLOW" > /tmp/comment-body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@/tmp/comment-body.md --silent
