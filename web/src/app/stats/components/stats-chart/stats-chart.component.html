<mat-card class="chart">
  <mat-card-header>
    <mat-card-title data-testid="stats-chart-title">{{
      chartTitle()
    }}</mat-card-title>
    <mat-card-subtitle data-testid="stats-chart-subtitle">{{
      subtitleText()
    }}</mat-card-subtitle>
    @if (granularity() === 'hourly') {
      <mat-button-toggle-group
        [value]="dayChartMode()"
        (change)="dayChartMode.set($event.value)"
        class="chart-mode-toggle"
        aria-label="Zeitraum der Stundenansicht"
        i18n-aria-label="@@chart.modeToggleAria"
      >
        <mat-button-toggle value="14h" i18n="@@chart.mode14h"
          >14h</mat-button-toggle
        >
        <mat-button-toggle value="24h" i18n="@@chart.mode24h"
          >24h</mat-button-toggle
        >
      </mat-button-toggle-group>
    }
    @if (showsBarModeToggle()) {
      <mat-button-toggle-group
        [value]="barMode()"
        (change)="barMode.set($event.value)"
        class="chart-mode-toggle"
        data-testid="stats-chart-bar-mode"
        aria-label="Balken gestapelt oder nebeneinander"
        i18n-aria-label="@@analysis.breakdown.modeAria"
      >
        <mat-button-toggle value="stacked" i18n="@@analysis.breakdown.stacked"
          >Gestapelt</mat-button-toggle
        >
        <mat-button-toggle value="grouped" i18n="@@analysis.breakdown.grouped"
          >Nebeneinander</mat-button-toggle
        >
      </mat-button-toggle-group>
    }
  </mat-card-header>

  <mat-card-content>
    <div class="chart-host">
      <canvas #chartCanvas></canvas>
    </div>

    <app-chart-legend
      class="legend"
      [items]="legendItems()"
      [ariaLabel]="legendAriaLabel"
      testId="stats-chart-legend"
      (itemToggle)="onLegendToggle($event)"
    />
  </mat-card-content>
</mat-card>
