@for (i of state().intervalIndexes(); track i) {
  <div class="interval-row">
    <div class="interval-header">
      <div
        class="interval-index"
        [id]="'interval-label-' + i"
        i18n="@@entry.interval.label"
      >
        Intervall {{ i + 1 }}
      </div>
      <div class="interval-actions">
        @if (state().hasMultipleIntervals()) {
          <button
            type="button"
            mat-icon-button
            class="action-remove"
            (click)="state().removeInterval(i)"
            i18n-aria-label="@@entry.intervals.remove"
            aria-label="Intervall entfernen"
          >
            <mat-icon>remove_circle_outline</mat-icon>
          </button>
        }
        @if ($last) {
          <button
            type="button"
            mat-icon-button
            class="action-add"
            (click)="state().addInterval()"
            i18n-aria-label="@@entry.intervals.add"
            aria-label="Intervall hinzufügen"
            i18n-matTooltip="@@entry.intervals.addTooltip"
            matTooltip="Weiteres Intervall hinzufügen"
          >
            <mat-icon>add_circle_outline</mat-icon>
          </button>
        }
      </div>
    </div>
    <div
      class="interval-fields"
      role="group"
      [attr.aria-labelledby]="'interval-label-' + i"
    >
      @if (state().intervalKind() === 'duration') {
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label i18n="@@entryDialog.durationMinutes">Minuten</mat-label>
          <input
            matInput
            type="number"
            inputmode="numeric"
            placeholder="0"
            min="0"
            step="1"
            [value]="state().intervalMinutesInputs()[i]"
            (input)="state().updateIntervalMinutes(i, asValue($event))"
          />
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label i18n="@@entryDialog.durationSeconds">Sekunden</mat-label>
          <input
            matInput
            type="number"
            inputmode="numeric"
            placeholder="30"
            min="0"
            [max]="state().secondsMax"
            step="1"
            [value]="state().intervalSecondsInputs()[i]"
            (input)="state().updateIntervalSeconds(i, asValue($event))"
          />
        </mat-form-field>
      } @else {
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="field-full"
        >
          <mat-label i18n="@@entryDialog.distance">Distanz (km)</mat-label>
          <input
            matInput
            type="text"
            inputmode="decimal"
            [placeholder]="state().distancePlaceholder"
            [value]="state().intervalDistanceInputs()[i]"
            (input)="state().updateIntervalDistance(i, asValue($event))"
          />
        </mat-form-field>
        @if (state().hasIntervalDurationCompanion()) {
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label i18n="@@entryDialog.durationMinutes">Minuten</mat-label>
            <input
              matInput
              type="number"
              inputmode="numeric"
              placeholder="0"
              min="0"
              step="1"
              [value]="state().intervalCompanionMinutesInputs()[i]"
              (input)="
                state().updateIntervalCompanionMinutes(i, asValue($event))
              "
            />
          </mat-form-field>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label i18n="@@entryDialog.durationSeconds">Sekunden</mat-label>
            <input
              matInput
              type="number"
              inputmode="numeric"
              placeholder="0"
              min="0"
              [max]="state().secondsMax"
              step="1"
              [value]="state().intervalCompanionSecondsInputs()[i]"
              (input)="
                state().updateIntervalCompanionSeconds(i, asValue($event))
              "
            />
          </mat-form-field>
        }
      }
    </div>
  </div>
}
