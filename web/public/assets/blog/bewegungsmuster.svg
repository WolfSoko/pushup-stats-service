<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">Die sechs Grundbewegungen</title>
  <desc id="d">Sechs Kacheln im Kreis um den Begriff Ganzkörper: Drücken, Ziehen, Kniebeuge, Hüftbeuge, Rumpf und Ausdauer, jeweils mit Beispielübungen aus dem Übungskatalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#ece7fb"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c4dff"/><stop offset="1" stop-color="#5b2fe0"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7043"/><stop offset="1" stop-color="#e64a19"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ec4a5"/><stop offset="1" stop-color="#1b9c82"/></linearGradient>
  </defs>
  <rect width="900" height="560" rx="20" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#2b2350">
    <text x="48" y="58" font-size="26" font-weight="700">Sechs Bewegungsmuster, ein ganzer Körper</text>
    <text x="48" y="86" font-size="15" fill="#6f6894">Jede Trainingswoche sollte jedes Muster mindestens einmal enthalten</text>

    <!-- center -->
    <circle cx="450" cy="320" r="70" fill="#fff" stroke="#e2dbfa" stroke-width="2"/>
    <text x="450" y="315" font-size="16" font-weight="700" text-anchor="middle">Ganz-</text>
    <text x="450" y="336" font-size="16" font-weight="700" text-anchor="middle">körper</text>

    <!-- spokes -->
    <g stroke="#cfc7ee" stroke-width="3">
      <line x1="450" y1="250" x2="450" y2="190"/>
      <line x1="510" y1="285" x2="600" y2="235"/>
      <line x1="510" y1="355" x2="600" y2="405"/>
      <line x1="450" y1="390" x2="450" y2="450"/>
      <line x1="390" y1="355" x2="300" y2="405"/>
      <line x1="390" y1="285" x2="300" y2="235"/>
    </g>

    <!-- tiles: 6 around -->
    <g font-size="12" fill="#fff" text-anchor="middle">
      <!-- top: Drücken -->
      <rect x="360" y="110" width="180" height="82" rx="14" fill="url(#c1)"/>
      <text x="450" y="138" font-size="17" font-weight="700">Drücken</text>
      <text x="450" y="160">Liegestütze, Dips,</text>
      <text x="450" y="177">Handstand-Halten</text>
      <!-- top right: Ziehen -->
      <rect x="600" y="180" width="200" height="82" rx="14" fill="url(#c2)"/>
      <text x="700" y="208" font-size="17" font-weight="700">Ziehen</text>
      <text x="700" y="230">Klimmzüge, Rudern,</text>
      <text x="700" y="247">Face Pulls, Dead Hang</text>
      <!-- bottom right: Rumpf -->
      <rect x="600" y="380" width="200" height="82" rx="14" fill="url(#c3)"/>
      <text x="700" y="408" font-size="17" font-weight="700">Rumpf</text>
      <text x="700" y="430">Plank, Dead Bug,</text>
      <text x="700" y="447">Hollow Hold, Beinheben</text>
      <!-- bottom: Ausdauer -->
      <rect x="360" y="450" width="180" height="82" rx="14" fill="url(#c1)"/>
      <text x="450" y="478" font-size="17" font-weight="700">Ausdauer</text>
      <text x="450" y="500">Laufen, Rad, Seilspringen,</text>
      <text x="450" y="517">Burpees, Schwimmen</text>
      <!-- bottom left: Hüftbeuge -->
      <rect x="100" y="380" width="200" height="82" rx="14" fill="url(#c2)"/>
      <text x="200" y="408" font-size="17" font-weight="700">Hüftbeuge</text>
      <text x="200" y="430">Glute Bridge, Einbein-RDL,</text>
      <text x="200" y="447">Good Morning</text>
      <!-- top left: Kniebeuge -->
      <rect x="100" y="180" width="200" height="82" rx="14" fill="url(#c3)"/>
      <text x="200" y="208" font-size="17" font-weight="700">Kniebeuge</text>
      <text x="200" y="230">Kniebeugen, Ausfallschritte,</text>
      <text x="200" y="247">Step-ups, Wandsitz</text>
    </g>
  </g>
</svg>
