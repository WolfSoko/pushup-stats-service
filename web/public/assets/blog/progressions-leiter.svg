<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">Die Progressions-Leiter der Liegestütz-Varianten</title>
  <desc id="d">Acht Stufen von leicht nach schwer: Wand, Hände erhöht, Knie, Standard, Diamant, Füße erhöht, Archer, einarmig. Mit jeder Stufe steigt der Anteil des bewegten Körpergewichts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#ece7fb"/></linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#5b2fe0"/></linearGradient>
  </defs>
  <rect width="900" height="560" rx="20" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#2b2350">
    <text x="48" y="58" font-size="26" font-weight="700">Die Progressions-Leiter</text>
    <text x="48" y="86" font-size="15" fill="#6f6894">Jede Stufe erhöht die Last – wechsle nach oben, sobald du 3 × 12–15 saubere Wiederholungen schaffst</text>

    <!-- steps: 8 steps, each 95px wide, rising 45px -->
    <g>
      <rect x="60"  y="470" width="95" height="40"  rx="6" fill="url(#step)"/>
      <rect x="160" y="425" width="95" height="85"  rx="6" fill="url(#step)"/>
      <rect x="260" y="380" width="95" height="130" rx="6" fill="url(#step)"/>
      <rect x="360" y="335" width="95" height="175" rx="6" fill="url(#step)"/>
      <rect x="460" y="290" width="95" height="220" rx="6" fill="url(#step)"/>
      <rect x="560" y="245" width="95" height="265" rx="6" fill="url(#step)"/>
      <rect x="660" y="200" width="95" height="310" rx="6" fill="url(#step)"/>
      <rect x="760" y="155" width="95" height="355" rx="6" fill="url(#step)"/>
    </g>
    <!-- labels above steps -->
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="107" y="458">Wand</text>
      <text x="207" y="413">Erhöht</text>
      <text x="307" y="368">Knie</text>
      <text x="407" y="323">Standard</text>
      <text x="507" y="278">Diamant</text>
      <text x="607" y="233">Decline</text>
      <text x="707" y="188">Archer</text>
      <text x="807" y="143">Einarmig</text>
    </g>
    <!-- percent inside steps -->
    <g font-size="13" fill="#fff" text-anchor="middle" font-weight="600">
      <text x="107" y="496">≈ 20 %</text>
      <text x="207" y="496">≈ 40–55 %</text>
      <text x="307" y="496">≈ 50 %</text>
      <text x="407" y="496">≈ 65–75 %</text>
      <text x="507" y="496">Trizeps +</text>
      <text x="607" y="496">≈ 70–75 %</text>
      <text x="707" y="496">einseitig</text>
      <text x="807" y="496">≈ 100 %+</text>
    </g>
    <text x="48" y="530" font-size="12" fill="#6f6894">Prozentwerte = ungefährer Anteil des Körpergewichts auf den Händen; „Trizeps +“ und „einseitig“ verschieben die Last statt sie zu erhöhen.</text>
  </g>
</svg>
