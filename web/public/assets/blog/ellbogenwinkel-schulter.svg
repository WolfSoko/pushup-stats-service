<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Ellbogenwinkel und Schulterbelastung</title>
  <desc id="d">Zwei Ansichten von oben: Ellbogen etwa 45 Grad am Körper bilden eine Pfeilform und schonen die Schulter. Ellbogen 90 Grad nach außen bilden eine T-Form und belasten die Rotatorenmanschette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#ece7fb"/></linearGradient>
  </defs>
  <rect width="900" height="440" rx="20" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#2b2350">
    <text x="48" y="58" font-size="26" font-weight="700">Pfeil statt T: der Ellbogenwinkel</text>
    <text x="48" y="86" font-size="15" fill="#6f6894">Ansicht von oben in der unteren Position</text>

    <!-- Panel A: 45 degrees -->
    <g transform="translate(60,110)">
      <rect width="370" height="270" rx="14" fill="#fff" stroke="#e2dbfa"/>
      <!-- body -->
      <rect x="160" y="30" width="50" height="220" rx="25" fill="#b3a9de"/>
      <circle cx="185" cy="30" r="24" fill="#7c4dff"/>
      <!-- arms 45deg: shoulder at (160,70)/(210,70) -->
      <line x1="160" y1="75" x2="95" y2="140" stroke="#7c4dff" stroke-width="20" stroke-linecap="round"/>
      <line x1="95" y1="140" x2="120" y2="200" stroke="#7c4dff" stroke-width="20" stroke-linecap="round"/>
      <line x1="210" y1="75" x2="275" y2="140" stroke="#7c4dff" stroke-width="20" stroke-linecap="round"/>
      <line x1="275" y1="140" x2="250" y2="200" stroke="#7c4dff" stroke-width="20" stroke-linecap="round"/>
      <circle cx="120" cy="205" r="12" fill="#ff7043"/><circle cx="250" cy="205" r="12" fill="#ff7043"/>
      <text x="300" y="100" font-size="16" font-weight="700">≈ 45°</text>
      <text x="20" y="250" font-size="15" font-weight="700" fill="#2e7d32">Pfeilform – schulterfreundlich</text>
    </g>

    <!-- Panel B: 90 degrees -->
    <g transform="translate(470,110)">
      <rect width="370" height="270" rx="14" fill="#fff" stroke="#e2dbfa"/>
      <rect x="160" y="30" width="50" height="220" rx="25" fill="#b3a9de"/>
      <circle cx="185" cy="30" r="24" fill="#7c4dff"/>
      <line x1="160" y1="75" x2="60" y2="75" stroke="#c62828" stroke-width="20" stroke-linecap="round"/>
      <line x1="60" y1="75" x2="60" y2="160" stroke="#c62828" stroke-width="20" stroke-linecap="round"/>
      <line x1="210" y1="75" x2="310" y2="75" stroke="#c62828" stroke-width="20" stroke-linecap="round"/>
      <line x1="310" y1="75" x2="310" y2="160" stroke="#c62828" stroke-width="20" stroke-linecap="round"/>
      <circle cx="60" cy="165" r="12" fill="#ff7043"/><circle cx="310" cy="165" r="12" fill="#ff7043"/>
      <text x="300" y="45" font-size="16" font-weight="700">90°</text>
      <text x="20" y="250" font-size="15" font-weight="700" fill="#c62828">T-Form – Stress für die Rotatorenmanschette</text>
    </g>

    <text x="48" y="412" font-size="13" fill="#6f6894">Faustregel: Von oben betrachtet soll dein Körper in der unteren Position wie ein Pfeil aussehen, nicht wie ein T.</text>
  </g>
</svg>
